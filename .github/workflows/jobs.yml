name: Scheduled jobs

# Netlify's functions don't run cron by themselves; these calls do. Set repository secrets SITE_URL and CRON_SECRET
# (the same CRON_SECRET as in Netlify's environment).
on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST: mohallas and area totals, seal yesterday on chain, retrain the forecast, purge
    - cron: "15 * * * *"    # hourly: reminders
    - cron: "0 6 */3 * *"   # every 3 days: keep the free Supabase project awake
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call jobs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          call() { curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/jobs/$1"; echo; }
          case "$SCHEDULE" in
            "30 20 * * *") call areas; call seal; call ml; call purge ;;
            "15 * * * *") call reminders ;;
            *) call keepalive ;;
          esac
