org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where the apps find the website's API.
# Debug builds default to http://10.0.2.2:3000 (the Mac's localhost, seen from the Android emulator).
# On a real phone over Wi-Fi, put your Mac's address in local.properties instead, e.g.
#   cw.apiUrl=http://192.168.1.20:3000
# Release builds need the deployed HTTPS site, e.g. cw.releaseApiUrl=https://<your-site>.netlify.app
